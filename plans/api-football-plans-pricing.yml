description: >-
  Published plans and pricing for API-Football. THIS FILE REPLACES A 2026-05-04
  SCAFFOLD that invented a Free / Professional / Enterprise ladder with TBD
  prices and a 1,000-request monthly quota — none of which API-Sports publishes.
  The real ladder is self-serve, priced monthly in US dollars, and metered in
  requests PER DAY. There is no enterprise "contact us" tier in the self-serve
  ladder; the differentiator between tiers is volume and historical depth, not
  features — every paid plan carries every endpoint and every competition.
plan_count: 4
currency: USD
billing_period: month
billing_notes: >-
  Subscriptions are handled through Stripe or PayPal. The provider advertises no
  auto-renewal and offers prepaid plans.
