source: >-
  npm registry search and package metadata (registry.npmjs.org), GitHub org
  probes, and /.well-known probes across every API-Football / API-Sports host,
  run 2026-09-02.
description: >-
  API-Sports ships NO Model Context Protocol server — no hosted endpoint, no
  first-party stdio package, no agent card, no llms.txt. Two community MCP
  servers wrap the public REST API; neither is the provider's and neither is
  wired as a provider capability in apis.yml. This file exists to record the
  absence with its evidence, not to claim an agent surface.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: searched
  note: >-
    No first-party MCP server exists to reach, so there is no endpoint and no
    install line. No candidate tool list was derived either: deriving one requires
    an OpenAPI, and the provider's OpenAPI
    (https://www.api-football.com/public/doc/openapi.yaml) is served to our
    crawler as a Cloudflare managed challenge. Inventing tool names from the
    endpoint paths we could confirm would fabricate an inputSchema we have never
    seen.
first_party: false
tools: []
