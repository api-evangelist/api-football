description: >-
  Client-library inventory for API-Football. THE HEADLINE FINDING IS AN ABSENCE:
  API-Sports publishes NO first-party SDK in any package registry, and operates
  no public GitHub organisation. Every package below is community-authored. No
  `SDKs` pointer is wired into apis.yml, because sdk_count must not be credited
  from third-party wrappers.
