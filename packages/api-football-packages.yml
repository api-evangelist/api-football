    api.github.com/orgs/{api-sports-io, apisports, api-football} all return 404 —
    there is no public source organisation. The only first-party distributed code
    we found is the browser widget bundle on the provider's own CDN, which is
    catalogued in components/api-football-components.yml rather than here.
